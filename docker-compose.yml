version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wasender
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  wa-sender:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./public/uploads:/app/public/uploads
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - db
      - redis

volumes:
  pgdata:
